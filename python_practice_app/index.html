<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Practice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">🐍 Python Practice</span>
        <span class="sidebar-count" id="exercise-count"></span>
      </div>
      <nav id="sidebar" class="sidebar-list"></nav>
    </aside>
    <main class="main">
      <div class="problem-header">
        <h1 id="problem-title"></h1>
        <span id="status" class="status"></span>
      </div>
      <p id="problem-description" class="description"></p>
      <p id="problem-constraint" class="constraint" hidden></p>
      <div id="editor-container" class="editor-container"></div>
      <div class="button-row">
        <button id="run-btn" type="button">Run Tests</button>
        <button id="reset-btn" type="button">Reset</button>
      </div>
      <div id="results" class="results"></div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
